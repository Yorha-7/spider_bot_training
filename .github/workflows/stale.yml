name: Stale

on:
  schedule:
    - cron: "0 0 * * 1"  # every Monday at midnight UTC
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7 days
            unless there is new activity. Comment to keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days
            unless there is new activity. Push a commit or comment to keep it open.
          close-issue-message: Closed due to inactivity. Reopen if still relevant.
          close-pr-message: Closed due to inactivity. Reopen and re-request review if still relevant.
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
